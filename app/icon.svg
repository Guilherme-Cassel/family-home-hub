<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Casa em Ordem">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19a771" />
      <stop offset="1" stop-color="#0c6f4d" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#fundo)" />

  <!-- Casa em silhueta cheia: no tamanho de favicon (16px) contorno vira
       borrão, então o desenho aposta em massa branca sólida. -->
  <path
    d="M16 5.1 27.2 14.7v10.6a1.7 1.7 0 0 1-1.7 1.7H6.5a1.7 1.7 0 0 1-1.7-1.7V14.7z"
    fill="#fff"
  />

  <!-- O "em ordem" do nome: check recortado no corpo da casa. -->
  <path
    d="m11.7 19.9 3 3 5.6-5.7"
    fill="none"
    stroke="#0c6f4d"
    stroke-width="2.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
